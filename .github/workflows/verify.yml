name: Verify
on:
  merge_group:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  clojure:
    # The shared Clojure pipeline of the metio repositories (kaocha on the
    # JVM, clj-kondo at fail-on-warning, eastwood, splint, cljfmt,
    # clj-watson), with the toolchain .breto.edn names. Pinned to a release
    # SHA, which Renovate bumps through the version comment.
    name: Clojure
    uses: metio/ci/.github/workflows/clojure.yml@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
    with:
      kondo-paths: src test dev
  babashka:
    # briko must run under babashka as well as on the JVM, and babashka
    # exposes fewer classes than the JVM, so the same suite runs here too.
    name: Babashka
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - run: bb test:bb
  reflection:
    # Every namespace runs in GraalVM native images, where a reflective call
    # fails at run time, so loading the sources must print no compiler
    # warning.
    name: Reflection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - run: bb reflection
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: metio/ci/breto@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
        with:
          registries: github:metio/toolchains
      - env:
          GH_TOKEN: ${{ github.token }}
        run: breto run ci-lint
  verify:
    # The single required check: new jobs only need to be listed here.
    name: Verify
    needs: [clojure, babashka, reflection, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
